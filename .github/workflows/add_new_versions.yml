name: Add new pipeline versions

on:
  # schedule:
  #   - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: add-new-versions
  cancel-in-progress: false

env:
  DESCRIPTOR_FILENAME: descriptor.json

jobs:
  detect-new-versions:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install dependencies
        run: pip install pyyaml packaging
      - name: Detect new pipeline versions
        id: detect
        run: python scripts/detect_new_versions.py .pipeline_info.yml ${GITHUB_OUTPUT}

  generate-config-files:
    needs: detect-new-versions
    if: needs.detect-new-versions.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-new-versions.outputs.matrix) }}
    env:
      PIPELINE_REPO_DIR: ${{ matrix.name }}
      PIPELINE_CONFIGS_REPO_DIR: nipoppy-pipeline-configs
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.github-repo }}
          ref: ${{ matrix.version }}
          path: ${{ env.PIPELINE_REPO_DIR }}
      - name: Get Python version
        id: get-python-version
        run: | # TODO some error handling if pyproject.toml is missing
          python_version=$(cd ${{ env.PIPELINE_REPO_DIR }} && python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['requires-python'])")
          echo "python_version=$python_version" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.get-python-version.outputs.python_version }}
      - name: Install the pipeline
        run: pip install ${{ env.PIPELINE_REPO_DIR }} # TODO make path configurable
      - name: Create a Boutiques descriptor file
        uses: styx-api/python-cli-to-boutiques@v1
        with:
          parser-type: ${{ matrix.parser-type }}
          parser-location: ${{ matrix.parser-location }}
          prog-name: ${{ matrix.name }}
          output-path: ${{ env.DESCRIPTOR_FILENAME }}
          open-pr: false
          exclude-version: false
          updates-str: '{"container-image.image": "${{ matrix.docker-image }}:${{ matrix.version }}", "container-image.type": "docker"}'
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          path: ${{ env.PIPELINE_CONFIGS_REPO_DIR }}
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14 # latest Nipoppy
      - name: Install Nipoppy
        run: |
          pip install nipoppy@git+https://github.com/michellewang/nipoppy.git@bosh_cli_only
          pip install boutiques@git+https://github.com/childmindresearch/boutiques_next.git
      - name: Generate config files
        run: |
          nipoppy pipeline create \
            --type ${{ matrix.pipeline-type }} \
            --source-descriptor ${{ env.DESCRIPTOR_FILENAME }} \
            ${{ env.PIPELINE_CONFIGS_REPO_DIR }}/pipelines/${{ matrix.pipeline-type }}/${{ matrix.name }}-${{ matrix.version }}
          # TODO remove
          tree ${{ env.PIPELINE_CONFIGS_REPO_DIR }}/pipelines/${{ matrix.pipeline-type }}/${{ matrix.name }}-${{ matrix.version }}
          cat ${{ env.PIPELINE_CONFIGS_REPO_DIR }}/pipelines/${{ matrix.pipeline-type }}/${{ matrix.name }}-${{ matrix.version }}/config.json
      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: ${{ env.PIPELINE_CONFIGS_REPO_DIR }}
          token: ${{ secrets.PR_PAT }}
          branch: bot/draft-${{ matrix.name }}-${{ matrix.version }}
