name: Check for new pipeline versions

on:
  # schedule:
  #   - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-new-versions
  cancel-in-progress: false

jobs:
  detect-updates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml packaging
      - name: Detect new pipeline versions
        id: detect
        run: python scripts/detect_updates.py .pipeline_info.yml ${GITHUB_OUTPUT}

  process-updates:
    needs: detect-updates
    if: needs.detect-updates.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.detect-updates.outputs.matrix) }}
    steps:
      - name: Stub downstream processing
        run: echo "Processing pipeline ${{ matrix.pipeline }} (${{ matrix.repo }}) at version ${{ matrix.version }}"
